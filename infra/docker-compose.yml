name: orderloop
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderloop
      POSTGRES_PASSWORD: orderloop
      POSTGRES_DB: orderloop
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderloop']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  # Opt-in local mail server: `pnpm services:mail`, then set MAIL_PROVIDER=smtp and SMTP_HOST=localhost, SMTP_PORT=1025.
  # Catches every email the API sends; read them at http://localhost:8025. Nothing is ever delivered externally.
  mailpit:
    image: axllent/mailpit
    profiles: ['mail']
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:

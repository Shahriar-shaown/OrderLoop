packages:
  - 'apps/*'
  - 'packages/*'

# Single React for web + Expo SDK 57 (bundles 19.2.3). Drift is checked by scripts/check-versions.mjs.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  typescript: 6.0.3
  zod: 4.6.7

allowBuilds:
  sharp: false
  unrs-resolver: false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  '@prisma/engines': true
  prisma: true
  '@node-rs/argon2': false
  '@scarf/scarf': false # swagger-ui-dist's optional analytics ping; not wanted

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31 || 57.0.32'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/router-server@57.0.13 || 57.0.14'
  - '@expo/ui@57.0.25 || 57.0.26'
  - babel-preset-expo@57.0.16
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23 || 57.0.24
  - expo-router@57.0.28 || 57.0.29
  - expo@57.0.30 || 57.0.31
  - '@expo/config-plugins@57.0.11'
  - expo-modules-jsi@57.1.3
  - expo-network@57.0.3

name: Dependency audit
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ['package.json', '**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request the result is information (the findings in this repo are in build and mobile tooling, see
    # docs/known-issues.md): it never blocks a merge. The weekly scheduled run and a manual run DO fail, so a new high or
    # critical advisory shows up as a red run and a notification.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      # Production dependencies only, high and critical only. No install is needed: the audit reads the lockfile.
      - run: pnpm audit --prod --audit-level=high

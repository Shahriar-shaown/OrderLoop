name: CI
on:
  push: { branches: [main] }
  pull_request:

# Read-only token; a newer push to the same branch replaces the run in progress.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orderloop, POSTGRES_PASSWORD: orderloop, POSTGRES_DB: orderloop }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U orderloop" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:versions
      - run: pnpm check:boundaries
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:init
      - run: pnpm test:integration
      # The mobile bundle is built by its own job.
      - run: pnpm build --filter='!@orderloop/mobile'

  mobile:
    # The app's two platform bundles, and the native project generated for each: a change to the Expo config or to
    # plugins/withIosScenes.js that breaks a store build is found here, not at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      # The app imports the workspace packages from their build output: build what the mobile app depends on first.
      - run: pnpm exec turbo run build --filter='@orderloop/mobile^...'
      - run: pnpm --filter @orderloop/mobile exec expo export --platform ios --platform android --output-dir /tmp/mobile-export
      - run: pnpm --filter @orderloop/mobile exec expo prebuild --no-install --platform ios --platform android
        # The production variant refuses a non-https API address: any https address will do for a build that is not shipped.
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_API_URL: https://api.ci.orderloop.test

  e2e:
    # Real browser scenarios against the whole stack: API, worker, web app, PostgreSQL, Redis and a mail catcher.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: orderloop, POSTGRES_PASSWORD: orderloop, POSTGRES_DB: orderloop }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U orderloop" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:init
      # The API and worker run from their build output.
      - run: pnpm build --filter='!@orderloop/mobile'
      # GitHub's Ubuntu runners include Google Chrome, which the tests drive (no browser download).
      # META_MODE and TIKTOK_MODE have no default in production, so they are named here as well (.env.example and apps/web/e2e/env.ts set them too).
      - run: pnpm --filter @orderloop/web test:e2e
        env: { META_MODE: mock, TIKTOK_MODE: mock }
      # Only when the job failed: reports and traces can hold screenshots of the app and its test data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    # The deployment artifacts (deploy/, ops/): every production image must build from a clean checkout, the compose file must
    # validate with its example environment, the monitoring rules must pass promtool, and an image must refuse to start with an
    # invalid environment. Nothing is pushed anywhere. Uses only tools preinstalled on the runner (docker, docker compose), so no
    # extra action is added.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Compose files validate with the example environment
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml --profile monitoring --profile ops config -q
      - name: Build the images (no push)
        run: |
          docker build -f deploy/Dockerfile --target api -t orderloop-api:ci .
          docker build -f deploy/Dockerfile --target worker -t orderloop-worker:ci .
          docker build -f deploy/Dockerfile --target migrate -t orderloop-migrate:ci .
          docker build -f deploy/Dockerfile --target ops -t orderloop-ops:ci .
          docker build -f deploy/Dockerfile --target web --build-arg NEXT_PUBLIC_API_URL=https://api.ci.orderloop.test -t orderloop-web:ci .
          docker images 'orderloop-*:ci' --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Images run as a non-root user and refuse an invalid environment
        run: |
          for t in api worker migrate web; do test "$(docker run --rm --entrypoint id orderloop-$t:ci -u)" != 0; done
          out=$(docker run --rm -e NODE_ENV=production orderloop-api:ci 2>&1) && { echo 'the api started without an environment'; exit 1; }
          echo "$out" | grep -q unhandled_error
      - name: Backup retention logic (ops/lib.sh) in the ops image
        run: docker run --rm -v "$PWD/ops":/ops:ro --entrypoint bash orderloop-ops:ci /ops/tests/retention.test.sh
      - name: Monitoring rules and config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring":/m:ro prom/prometheus:v3.15.1 check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring":/m:ro prom/prometheus:v3.15.1 test rules /m/tests/alerts.test.yml
          echo http://receiver.invalid/hook > "$RUNNER_TEMP/alert_webhook_url"
          docker run --rm --entrypoint amtool -v "$PWD/ops/monitoring/alertmanager.yml":/etc/alertmanager/alertmanager.yml:ro -v "$RUNNER_TEMP/alert_webhook_url":/run/secrets/alert_webhook_url:ro prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml

# Weekly update PRs, grouped so a week is one PR per ecosystem rather than dozens. Security advisories still open their own PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors (Prisma, NestJS, Next, Expo, Zod) change behaviour and are done by hand, with the migration notes.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
